# CV data in RenderCV format, shared by the /cv/ page (al_folio_cv) and the PDF workflow (.github/workflows/render-cv.yml).
# RenderCV rejects unknown keys at the `cv` level, so the headline lives in `headline` and the profile in its own section.
cv:
  name: Mahdi Kallel
  headline: PhD candidate in reinforcement learning
  location: Würzburg, Germany
  email: mahdi.kallel@uni-wuerzburg.de
  website: https://kallel-mahdi.github.io
  social_networks:
    - network: GitHub
      username: kallel-mahdi
    - network: Google Scholar
      username: Bt0FV_AAAAAJ

  sections:
    Profile:
      - bullet: "Graduating from the University of Würzburg in April 2027, advised by Carlo D'Eramo. I started out designing algorithms for exploration and policy optimization, and now study the learning dynamics of neural networks, in particular memory and plasticity in continual learning, and how reinforcement learning changes them compared with supervised learning."

    # The site template shows the venue from `publisher`, the PDF from `journal`.
    Publications:
      - title: The Spectral Anatomy of Plasticity Loss
        authors:
          - "**Mahdi Kallel**"
          - Nour Jamoussi
          - Johannes Tölle
          - Marios Kountouris
          - Carlo D'Eramo
        journal: AXIOM Workshop at NeurIPS 2026
        publisher: AXIOM Workshop at NeurIPS 2026
        date: 2026
        url: https://openreview.net/forum?id=Kgz0zlJVS6
        summary: "Uses random matrix theory to explain loss of plasticity, and shows that protecting the directions that hold old knowledge keeps networks trainable."

      - title: "Do Not Imitate, Reinforce: Iterative Classification via Belief Refinement"
        authors:
          - "**Mahdi Kallel**"
          - Johannes Tölle
          - Ahmed Hendawy
          - Carlo D'Eramo
        journal: Transactions on Machine Learning Research (TMLR), 2026
        publisher: Transactions on Machine Learning Research (TMLR), 2026
        date: 2026
        url: https://arxiv.org/abs/2604.22110
        summary: "Trains classifiers by reinforcement learning, rewarding every step that improves the prediction. Achieves a better balance of accuracy and calibration than cross-entropy and stays robust to label noise."

      - title: "PPO+: Enhancing Proximal Policy Optimization"
        authors:
          - "**Mahdi Kallel**"
          - Jose-Luis Holgado-Alvarez
          - Samuele Tosatto
          - Carlo D'Eramo
        journal: Reinforcement Learning Journal (RLC 2026)
        publisher: Reinforcement Learning Journal (RLC 2026)
        date: 2026
        url: https://rlj.cs.umass.edu/2026/papers/Paper8.html
        summary: "Shows that PPO is held back by its critic, and fixes it with an off-policy critic."

      - title: "Use the Online Network If You Can: Towards Fast and Stable Reinforcement Learning"
        authors:
          - Ahmed Hendawy
          - Henrik Metternich
          - Théo Vincent
          - "**Mahdi Kallel**"
          - Jan Peters
          - Carlo D'Eramo
        journal: ICLR 2026
        publisher: ICLR 2026
        date: 2026
        url: https://arxiv.org/abs/2510.02590

      - title: Augmented Bayesian Policy Search
        authors:
          - "**Mahdi Kallel**"
          - Debabrota Basu
          - Riad Akrour
          - Carlo D'Eramo
        journal: ICLR 2024
        publisher: ICLR 2024
        date: 2024
        url: https://proceedings.iclr.cc/paper_files/paper/2024/hash/7eca17ef54789b0663cab421f2e9dbf5-Abstract-Conference.html
        summary: "Turns a learned critic into the prior of Bayesian policy search, outperforming earlier Bayesian optimization methods in high dimensions."

      - title: Cyclicity-Regularized Coordination Graphs
        authors:
          - Oliver Järnefelt
          - "**Mahdi Kallel**"
          - Carlo D'Eramo
        journal: RLC 2024
        publisher: RLC 2024
        date: 2024
        url: https://rlj.cs.umass.edu/2024/papers/RLJ_RLC_2024_40.pdf

    Research Experience:
      - company: INRIA Lille, SCOOL Research Group
        position: Research Intern
        location: France
        date: 2022
        highlights:
          - Started the work on Bayesian policy search with deterministic policies that became Augmented Bayesian Policy Search (ICLR 2024).

      - company: EURECOM
        position: Research Intern
        location: Biot, France
        date: 2020
        highlights:
          - Compared centralized and decentralized approaches to mobile traffic prediction and load balancing.

    Industry Experience:
      - company: Mcovision (independent)
        position: Machine Learning Engineer
        location: Paris, France
        date: 2021
        highlights:
          - Built a classifier of echocardiography videos for cardiac amyloidosis and other rare heart diseases with Hôpital Cochin, from data cleaning to training.

      - company: SustainEcho
        position: Research Intern
        location: Paris, France
        date: 2021
        highlights:
          - Explored few-shot and hierarchical learning methods for classification with little data.

    Education:
      - institution: University of Würzburg
        degree: PhD
        area: Reinforcement Learning
        location: Germany
        start_date: 2023
        end_date: 2027
        highlights:
          - "Expected April 2027. Supervisor: Prof. Carlo D'Eramo."
          - "Teaching: Introduction to Machine Learning; Introduction to Reinforcement Learning."

      - institution: Université Paris-Saclay
        degree: MSc
        area: Optimization
        location: France
        start_date: 2021
        end_date: 2022
        highlights:
          - "Coursework: Convex analysis, dynamic programming, stochastic optimization and approximation."

      - institution: ENS Paris-Saclay
        degree: MSc
        area: Mathematics, Vision, Learning (MVA)
        location: France
        start_date: 2020
        end_date: 2021
        highlights:
          - "Coursework: Reinforcement learning, convex optimization, kernel methods, advanced deep learning."

      - institution: Télécom Paris / EURECOM
        degree: BSc
        area: Data Science
        location: France
        start_date: 2018
        end_date: 2020

    Supervision, Talks and Service:
      - label: Supervision
        details: Johannes Tölle, MSc thesis, University of Würzburg (2026). The thesis received the VDE Bayern Award 2026, and Johannes co-authored two of the papers above.
      - label: Talks
        details: On Better Priors for Policy Search. Invited talk and lab visit, Improbable AI Lab (Pulkit Agrawal), MIT, August 2024.
      - label: Reviewer
        details: NeurIPS (top reviewer, 2026), ICLR, ICML, RLC

    Technical Skills:
      - label: Programming
        details: Python, JAX, PyTorch, NumPy, Julia, C
      - label: Languages
        details: Arabic (native), English (fluent), French (fluent), German (basic)

# RenderCV 2.8 only loads design/locale overlays from the main file, not from --settings.
settings:
  render_command:
    design: ../assets/rendercv/design.yaml
    locale: ../assets/rendercv/locale.yaml
